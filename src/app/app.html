<main class="app-shell">
  <section class="todo-card">
    <header class="app-header">
      <div>
        <h1>My Tasks</h1>
        <p class="subtitle">
          {{ openTaskCount }} {{ openTaskCount === 1 ? 'task' : 'tasks' }} left to finish
        </p>
      </div>
    </header>

    <form class="add-task-form" [formGroup]="taskForm" (ngSubmit)="addTask()">
      <label for="task-title">Add a task</label>
      <div class="add-task-row">
        <input
          id="task-title"
          type="text"
          formControlName="title"
          placeholder="What needs to be done?"
          maxlength="100"
          autocomplete="off"
        />
        <button type="submit" [disabled]="taskForm.invalid">Add task</button>
      </div>
      @if (titleControl.invalid && titleControl.touched) {
        <p class="validation-message">Enter a task between 2 and 100 characters.</p>
      }
    </form>

    <section class="task-list" aria-label="To-do list">
      @for (task of tasks; track task.id) {
        <app-task
          [task]="task"
          [statuses]="statuses"
          (taskUpdated)="updateTask($event)"
          (taskDeleted)="deleteTask($event)"
        />
      } @empty {
        <div class="empty-state">
          <h2>All clear</h2>
          <p>Add a task above to get started.</p>
        </div>
      }
    </section>
  </section>
</main>
